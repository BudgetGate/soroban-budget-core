name: Core CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

# Build and test only read the repository, so the token gets nothing more.
permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v7
    
    - name: Set up Go
      uses: actions/setup-go@v7
      with:
        go-version-file: go.mod
        
    - name: Check formatting
      run: test -z "$(gofmt -l .)"

    - name: Vet
      run: go vet ./...

    - name: Build
      run: go build -v ./...
      
    - name: Test
      run: go test -v ./...
