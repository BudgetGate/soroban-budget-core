name: Audit

# Runs govulncheck every week, so a new advisory in a dependency or in the Go standard library
# (which also needs a go.mod bump, as in C19) shows up as a failed run, and on every pull request,
# so one that adds or updates a vulnerable dependency shows it before merging. Not a required
# check: an advisory published for an unchanged dependency would otherwise block unrelated pull
# requests until it is fixed.
on:
  schedule:
    - cron: "11 6 * * 1"
  workflow_dispatch:
  pull_request:
    branches: [ "main" ]

permissions:
  contents: read

jobs:
  govulncheck:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

    - name: Set up Go
      uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
      with:
        go-version-file: go.mod

    # Every module must match Go's public checksum database (sum.golang.org), so a tampered or
    # swapped download fails here.
    - name: Module checksums
      run: go mod verify

    - name: govulncheck
      run: go run golang.org/x/vuln/cmd/govulncheck@v1.9.0 ./...
