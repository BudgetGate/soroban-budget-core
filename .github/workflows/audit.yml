name: Audit

# Runs govulncheck every week, so a new advisory in a dependency or in the Go standard library
# (which also needs a go.mod bump, as in C19) shows up as a failed run, and on every pull request,
# so one that adds or updates a vulnerable dependency shows it before merging. Not a required
# check: an advisory published for an unchanged dependency would otherwise block unrelated pull
# requests until it is fixed.
on:
  schedule:
    - cron: "11 6 * * 1"
  workflow_dispatch:
  pull_request:
    branches: [ "main" ]

permissions:
  contents: read

jobs:
  govulncheck:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v7

    - name: Set up Go
      uses: actions/setup-go@v7
      with:
        go-version-file: go.mod

    - name: govulncheck
      run: go run golang.org/x/vuln/cmd/govulncheck@v1.9.0 ./...
