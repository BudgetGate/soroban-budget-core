name: Audit

# Runs govulncheck every week, so a new advisory in a dependency or in the Go standard library
# (which also needs a go.mod bump, as in C19) shows up as a failed run. Not a required check:
# a new advisory does not block unrelated pull requests.
on:
  schedule:
    - cron: "11 6 * * 1"
  workflow_dispatch:
  pull_request:
    branches: [ "main" ]
    paths: [ ".github/workflows/audit.yml" ]

permissions:
  contents: read

jobs:
  govulncheck:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v7

    - name: Set up Go
      uses: actions/setup-go@v7
      with:
        go-version-file: go.mod

    - name: govulncheck
      run: go run golang.org/x/vuln/cmd/govulncheck@v1.9.0 ./...
