name: Dependency review

# Fails a pull request that adds a dependency with a known advisory in GitHub's database,
# including packages flagged as malware, before it can be merged.
on:
  pull_request:
    branches: [ main ]

permissions:
  contents: read

jobs:
  dependency-review:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/dependency-review-action@v5
        with:
          fail-on-severity: moderate
