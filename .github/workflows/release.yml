name: Release

# Pushing a tag like v0.2.0 tests the tagged commit, cross-compiles budget-core for each platform
# below (the assets the GitHub Action downloads from releases/download/v<version>/), runs each
# binary on a runner of its own platform, and publishes them with SHA256SUMS and a build
# provenance attestation for each binary.
# A pull request that changes this file runs the build and the platform checks without publishing.
on:
  push:
    tags: [ "v*" ]
  pull_request:
    branches: [ "main" ]
    paths: [ ".github/workflows/release.yml" ]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
      attestations: write
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

    - name: Set up Go
      uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
      with:
        go-version-file: go.mod

    - name: Check formatting
      run: test -z "$(gofmt -l .)"

    - name: Vet
      run: go vet ./...

    - name: Test
      run: go test ./...

    # Static builds (no cgo), so one Linux runner can build every platform. A tag push stamps the
    # tag into the binary (--version prints it); any other run builds "dev".
    - name: Build
      run: |
        version=dev
        [ "$GITHUB_REF_TYPE" = tag ] && version="$GITHUB_REF_NAME"
        for target in linux/amd64 linux/arm64 darwin/amd64 darwin/arm64 windows/amd64 windows/arm64; do
          goos="${target%/*}"; goarch="${target#*/}"
          ext=""; [ "$goos" = windows ] && ext=".exe"
          CGO_ENABLED=0 GOOS="$goos" GOARCH="$goarch" go build -trimpath -ldflags "-s -w -X main.version=$version" -o "dist/budget-core-$goos-$goarch$ext" .
        done

    - name: Checksums
      working-directory: dist
      run: |
        sha256sum budget-core-* > SHA256SUMS && cat SHA256SUMS
        [ "$(wc -l < SHA256SUMS)" -eq 6 ]

    # Signed build provenance for each binary (the repository, commit and workflow run that built
    # it), checked with `gh attestation verify <file> -R BudgetGate/soroban-budget-core`. Pull
    # requests from forks get no OIDC token, so they skip it.
    - name: Attest build provenance
      if: github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository
      uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
      with:
        subject-path: dist/budget-core-*

    - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
      with:
        name: release
        path: dist/

  # Runs each binary on its own platform, after checking it against SHA256SUMS.
  # A comparison would need testnet for the network caps, so --help and --version are the smoke test.
  smoke-test:
    needs: build
    strategy:
      fail-fast: false
      matrix:
        include:
        - { runner: ubuntu-24.04, asset: budget-core-linux-amd64 }
        - { runner: ubuntu-24.04-arm, asset: budget-core-linux-arm64 }
        - { runner: macos-26-intel, asset: budget-core-darwin-amd64 }
        - { runner: macos-latest, asset: budget-core-darwin-arm64 }
        - { runner: windows-latest, asset: budget-core-windows-amd64.exe }
        - { runner: windows-11-arm, asset: budget-core-windows-arm64.exe }
    runs-on: ${{ matrix.runner }}
    defaults:
      run:
        shell: bash
    steps:
    - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
      with:
        name: release
        path: dist

    - name: Check the checksum
      working-directory: dist
      run: |
        grep " ${{ matrix.asset }}\$" SHA256SUMS > asset.sum
        if command -v sha256sum >/dev/null; then sha256sum -c asset.sum; else shasum -a 256 -c asset.sum; fi

    # On a tag push the binary must report that tag; otherwise it reports "dev".
    - name: Run it
      working-directory: dist
      env:
        REF_TYPE: ${{ github.ref_type }}
        REF_NAME: ${{ github.ref_name }}
      run: |
        chmod +x "${{ matrix.asset }}"
        "./${{ matrix.asset }}" --help
        reported=$("./${{ matrix.asset }}" --version)
        echo "$reported"
        expected="budget-core dev"
        [ "$REF_TYPE" = tag ] && expected="budget-core $REF_NAME"
        [ "$reported" = "$expected" ]

  publish:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [ build, smoke-test ]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
    - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
      with:
        name: release
        path: dist

    - name: Create the release
      env:
        GH_TOKEN: ${{ github.token }}
      run: >
        gh release create "$GITHUB_REF_NAME"
        dist/budget-core-* dist/SHA256SUMS
        --repo "$GITHUB_REPOSITORY"
        --verify-tag
        --title "$GITHUB_REF_NAME"
        --generate-notes
