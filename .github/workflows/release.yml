name: Release

# Pushing a tag like v0.2.0 tests the tagged commit, builds budget-core-linux-amd64 (the asset the
# GitHub Action downloads from releases/download/v<version>/) and publishes it with SHA256SUMS.
# A pull request that changes this file runs the same build without publishing.
on:
  push:
    tags: [ "v*" ]
  pull_request:
    branches: [ "main" ]
    paths: [ ".github/workflows/release.yml" ]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v7

    - name: Set up Go
      uses: actions/setup-go@v7
      with:
        go-version-file: go.mod

    - name: Check formatting
      run: test -z "$(gofmt -l .)"

    - name: Vet
      run: go vet ./...

    - name: Test
      run: go test ./...

    - name: Build
      run: CGO_ENABLED=0 GOOS=linux GOARCH=amd64 go build -trimpath -ldflags "-s -w" -o dist/budget-core-linux-amd64 .

    - name: Smoke test
      run: dist/budget-core-linux-amd64 --help

    - name: Checksums
      working-directory: dist
      run: sha256sum budget-core-linux-amd64 > SHA256SUMS && cat SHA256SUMS

    - uses: actions/upload-artifact@v7
      with:
        name: release
        path: dist/

  publish:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
    - uses: actions/download-artifact@v7
      with:
        name: release
        path: dist

    - name: Create the release
      env:
        GH_TOKEN: ${{ github.token }}
      run: >
        gh release create "$GITHUB_REF_NAME"
        dist/budget-core-linux-amd64 dist/SHA256SUMS
        --repo "$GITHUB_REPOSITORY"
        --verify-tag
        --title "$GITHUB_REF_NAME"
        --generate-notes
